# Set TRUSTME_DATA_ROOT to the `_artifacts` directory of the latest all-window run.
seed: 42
run_id: null

paths:
  repo_root: ..
  processed_root: ${TRUSTME_DATA_ROOT}/TrustMe_cleaned_windowed_filtered
  features_csv: ${TRUSTME_DATA_ROOT}/TrustMe_handcrafted/tobii_handcrafted_features.csv
  results_root: results/experiments

targets:
  - name: q5
    mode: single_column
    column: "5"

experiment:
  representations: [raw, features, embeddings]
  allow_missing_features: false
  model: random_forest
  classifiers: [random_forest, mlp]
  embedding_variants:
    gazemae:
      kind: gazemae_parquet
      path: ${TRUSTME_DATA_ROOT}/TrustMe_gazemae_embeddings/gazemae_outputs/trustme_gazemae_embeddings.parquet
      id_column: window_uid
      feature_prefixes: [z_pos_, z_vel_]
    moment:
      kind: moment_npz
      path: ${TRUSTME_DATA_ROOT}/TrustMe_moment_embeddings/embeddings_02/moment_embeddings.npz
      metadata_path: ${TRUSTME_DATA_ROOT}/TrustMe_moment_embeddings/embeddings_02/segments_metadata.parquet

label_rule:
  mode: centered_subject_train_gt0
  unseen_subject_center: global_train_mean
  threshold: 3.0

protocols:
  enabled:
    loso: false
    loso_normalized: true
    within_subject_temporal_split: false
    rolling_window: false
    hybrid_loso_adaptation: false
    persistence_baseline: false
    hmm_rolling: false
  params:
    temporal_split_ratio: 0.7
    rolling_train_size: 120
    rolling_test_size: 30
    rolling_step_size: 15
    hybrid_calibration_size: 130
    hybrid_test_size: 30
    hybrid_step_size: 15
    persistence_calibration_size: 300
    persistence_test_size: 90
    persistence_step_size: 45
    hmm_train_size: 300
    hmm_test_size: 90
    hmm_step_size: 45
    hmm_n_states: 2
    min_train_samples: 10
    min_test_samples: 5

evaluation:
  one_class_policy: keep_with_nan
  metrics: [accuracy, balanced_accuracy, macro_f1, auc]

plotting:
  enabled: true
  confusion_top_k: 9

raw:
  backend: parquet
  csv_path: null
  channels: [PupilSizeLeft, PupilSizeRight, GazePointX, GazePointY, AverageDistance]
  resample_length: 120
  length_mode: truncate_pad
  flatten_length: 120
  validity_gaze_columns: [ValidityLeft, ValidityRight]
  validity_pupil_columns: [PupilValidityLeft, PupilValidityRight]
  validity_valid_value: 1

features:
  structural_drop:
    metadata_columns: ["Unnamed: 0", Subject, subject, Filename, source_file, Path, Label, window_uid, window_id, window_id_str, Time_start, Time_end, Index_start, Index_end, "Win len", "Overlap Percent", Fs]
  statistical_filter:
    max_nan_fraction: 0.60
    correlation_threshold: 0.80

scaling:
  use_standard_scaler: false

models:
  majority:
    strategy: most_frequent
  logistic_regression:
    max_iter: 2000
  lgbm:
    n_jobs: -1
    verbose: -1
    force_col_wise: true
  svm_rbf:
    kernel: rbf
    probability: true
  mlp:
    hidden_dims: [1028, 512, 256, 128, 64]
    activation: gelu
    use_layernorm: true
    optimizer: adam
    lr: 0.0002
    weight_decay: 0.001
    batch_size: 1024
    max_epochs: 200
    patience: 15
    seed: 42
  random_forest:
    n_estimators: 300
    class_weight: balanced
    random_state: 42
    n_jobs: -1
