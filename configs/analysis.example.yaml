# Root containing <subject>/ml/tobii/<standard representation CSVs>.
trustme_root: /home/ppg/eyetracking/TrustME-ET/data/raw/TrustMe

random_state: 42
output_dir: ../results/data_analysis
subject_column: subject
target_columns: ["5"]

plots:
  pupil_columns: [PupilSizeLeft, PupilSizeRight]
  gaze_columns: [GazePointX, GazePointY]
  projection_methods: [pca, tsne, umap]
  color_by: ["5", subject]
  max_raw_rows: 250000
  max_projection_points: 5000
