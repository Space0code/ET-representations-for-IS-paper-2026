[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustme-et-representations"
version = "0.1.0"
description = "Controlled comparison of TrustMe eye-tracking representations"
requires-python = ">=3.10"
dependencies = [
  "lightgbm>=4.0,<5",
  "matplotlib>=3.8,<3.11",
  "numpy>=1.25,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<24",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<1.9",
  "seaborn>=0.13,<0.14",
  "tabulate>=0.9,<1",
  "torch>=2.2,<2.11",
]

[project.optional-dependencies]
analysis = ["umap-learn>=0.5,<0.6"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

